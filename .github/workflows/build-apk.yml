name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle -p sver-file-android assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          cp sver-file-android/app/build/outputs/apk/debug/app-debug.apk SverFile-v1.0.apk
          ls -lh SverFile-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SverFile-APK
          path: SverFile-v1.0.apk
